<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Ecossistema CelPhius Tecnologia</title><desc id="desc">CelPhius conecta Axis, Aurion, Vectta e Orbytta. chAI é a camada transversal de inteligência na visão de produto.</desc><rect width="1200" height="660" rx="24" fill="#020810"/><g font-family="Arial,Helvetica,sans-serif"><text x="56" y="66" fill="#f4f5f9" font-size="32" font-weight="700">CelPhius Tecnologia</text><text x="56" y="103" fill="#a3acc7" font-size="21">O ponto onde seus projetos se encontram.</text><g fill="none" stroke="#53cdff" stroke-width="2"><path d="M600 304 600 173M600 304 220 304M600 304 980 304M600 304 390 470M600 304 810 470"/><path d="M220 304 390 470 810 470 980 304" stroke="#a881cf" stroke-dasharray="6 8"/></g><g fill="#0b1230" stroke="#242c5e" stroke-width="2"><rect x="464" y="260" width="272" height="90" rx="18"/><rect x="481" y="143" width="238" height="63" rx="15"/><rect x="104" y="263" width="232" height="90" rx="15"/><rect x="864" y="263" width="232" height="90" rx="15"/><rect x="274" y="427" width="232" height="90" rx="15"/><rect x="694" y="427" width="232" height="90" rx="15"/></g><g text-anchor="middle"><text x="600" y="299" fill="#f4f5f9" font-size="27" font-weight="700">CelPhius</text><text x="600" y="327" fill="#a3acc7" font-size="17">Centro do ecossistema</text><text x="600" y="184" fill="#53cdff" font-size="25" font-weight="700">Axis · Eixo gerencial</text><text x="220" y="300" fill="#53cdff" font-size="27" font-weight="700">Aurion</text><text x="220" y="330" fill="#a3acc7" font-size="17">Arquitetura de jornadas</text><text x="980" y="300" fill="#f41e90" font-size="27" font-weight="700">Vectta</text><text x="980" y="330" fill="#a3acc7" font-size="17">Implantação</text><text x="390" y="465" fill="#b4e34d" font-size="27" font-weight="700">Orbytta</text><text x="390" y="495" fill="#a3acc7" font-size="17">Gestão e integração</text><text x="810" y="465" fill="#a881cf" font-size="27" font-weight="700">chAI</text><text x="810" y="495" fill="#a3acc7" font-size="17">Inteligência transversal</text></g><g fill="#53cdff"><circle cx="600" cy="241" r="6"/><circle cx="360" cy="304" r="6"/><circle cx="840" cy="304" r="6"/><circle cx="490" cy="390" r="6"/><circle cx="710" cy="390" r="6"/></g><text x="56" y="588" fill="#a3acc7" font-size="17">Arquitetura de marca e visão de produto. Integrações futuras dependem de implementação.</text><text x="56" y="620" fill="#a3acc7" font-size="17">Os pontos ligados representam a constelação. A logo CP original permanece como símbolo da empresa.</text></g></svg>